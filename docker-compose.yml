services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow
    ports:
      - "5433:5432"
    volumes:
      - devflow_pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devflow:devflow@db:5432/devflow
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      - db

volumes:
  devflow_pgdata:
