<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevFlow Dashboard</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e3e6ea;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #4f46e5;
    --success: #16a34a;
    --fail: #dc2626;
    --pending: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: grid;
    gap: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card h2 button {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    color: var(--text);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .ticket-search { display: flex; gap: 8px; margin-bottom: 16px; }
  .ticket-search input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .ticket-search button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  .ticket-header { margin-bottom: 18px; }
  .ticket-header .key { font-weight: 600; font-size: 16px; }
  .ticket-header .status {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 10px;
    border-radius: 999px;
    background: #eef2ff;
    color: var(--accent);
    font-size: 12px;
  }
  .ticket-header .summary { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--border);
  }
  .timeline-item { position: relative; padding-bottom: 18px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-item::before {
    content: "";
    position: absolute;
    left: -20px;
    top: 3px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--card);
  }
  .timeline-item.success::before { background: var(--success); }
  .timeline-item.fail::before { background: var(--fail); }
  .timeline-item .label { font-weight: 500; font-size: 13px; }
  .timeline-item .detail { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .timeline-item .ts { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .empty, .error { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .error { color: var(--fail); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>DevFlow Dashboard</h1>
  <p>Live view of GitHub / Jira / Slack events processed by DevFlow AI</p>
</header>
<main>
  <section class="card">
    <h2>Ticket Timeline</h2>
    <div class="ticket-search">
      <input id="ticket-input" placeholder="e.g. KAN-4" autocomplete="off">
      <button id="ticket-search-btn">View</button>
    </div>
    <div id="ticket-result"></div>
  </section>

  <section class="card">
    <h2>Recent Events <button id="refresh-events">Refresh</button></h2>
    <table>
      <thead>
        <tr><th>Time</th><th>Source</th><th>Event</th><th>Ticket</th></tr>
      </thead>
      <tbody id="events-body"></tbody>
    </table>
  </section>
</main>

<script>
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString();
}

function statusClass(kind, label) {
  const l = label.toLowerCase();
  if (l.includes('success') || l.includes('merged') || l.includes('succeeded')) return 'success';
  if (l.includes('fail')) return 'fail';
  return '';
}

async function loadEvents() {
  const tbody = document.getElementById('events-body');
  tbody.innerHTML = '<tr><td colspan="4" class="empty">Loading…</td></tr>';
  try {
    const resp = await fetch('/api/events?limit=50');
    const events = await resp.json();
    if (!events.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No events yet.</td></tr>';
      return;
    }
    tbody.innerHTML = events.map(e => `
      <tr>
        <td>${fmtTime(e.received_at)}</td>
        <td>${e.source}</td>
        <td>${e.event_type}</td>
        <td>${e.ticket_key || '—'}</td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="4" class="error">Failed to load events.</td></tr>';
  }
}

async function loadTicket(key) {
  const result = document.getElementById('ticket-result');
  result.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const resp = await fetch(`/api/tickets/${encodeURIComponent(key)}/timeline`);
    if (resp.status === 404) {
      result.innerHTML = `<div class="error">No data found for ${key}.</div>`;
      return;
    }
    const data = await resp.json();

    let html = `<div class="ticket-header">
      <span class="key">${data.ticket_key}</span>
      ${data.jira_status ? `<span class="status">${data.jira_status}</span>` : ''}
      ${data.jira_summary ? `<div class="summary">${data.jira_summary}</div>` : ''}
    </div>`;

    if (!data.timeline.length) {
      html += '<div class="empty">No PR or workflow activity recorded yet.</div>';
    } else {
      html += '<div class="timeline">' + data.timeline.map(item => `
        <div class="timeline-item ${statusClass(item.kind, item.label)}">
          <div class="label">${item.url ? `<a href="${item.url}" target="_blank">${item.label}</a>` : item.label}</div>
          <div class="detail">${item.detail}</div>
          <div class="ts">${fmtTime(item.timestamp)}</div>
        </div>
      `).join('') + '</div>';
    }
    result.innerHTML = html;
  } catch (err) {
    result.innerHTML = '<div class="error">Failed to load ticket data.</div>';
  }
}

document.getElementById('ticket-search-btn').addEventListener('click', () => {
  const key = document.getElementById('ticket-input').value.trim();
  if (key) loadTicket(key);
});
document.getElementById('ticket-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('ticket-search-btn').click();
});
document.getElementById('refresh-events').addEventListener('click', loadEvents);

loadEvents();
setInterval(loadEvents, 10000);
</script>
</body>
</html>
